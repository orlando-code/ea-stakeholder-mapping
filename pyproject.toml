[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-stakeholder-mapping"
version = "0.3.0"
description = "EA Stakeholder Mapping - Analyze attendee metadata, compare NLP/LLM extraction, and visualize geographic/semantic distributions"
requires-python = ">=3.10"
dependencies = [
    # Core data processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    
    # NLP
    "spacy>=3.6.0",
    
    # Visualization
    "plotly>=5.15.0",
    "tqdm>=4.65.0",
    
    # Geographic
    "pycountry>=23.0.0",
    "googlemaps>=4.10.0",
    "requests>=2.28.0",
    
    # Configuration
    "pyyaml>=6.0",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
all = [
    "ea-stakeholder-mapping[semantic,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sm*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
